<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default "zh-cn" }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
{{ with .Params.cover }}<meta property="og:image" content="{{ . | relURL }}">{{ end }}
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ "" | relURL }}">{{ site.Title }}</a>
  <nav>
    <a href="{{ "posts/" | relURL }}">文章</a>
    <a href="{{ "index.xml" | relURL }}">RSS</a>
  </nav>
</header>
<main class="wrap">
{{ block "main" . }}{{ end }}
</main>
<footer class="site-footer">
  <p>© {{ now.Year }} {{ site.Params.author }} · Built with Hugo</p>
</footer>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
document.querySelectorAll('pre > code.language-mermaid').forEach((el) => {
  const div = document.createElement('div');
  div.className = 'mermaid';
  div.textContent = el.textContent;
  el.parentElement.replaceWith(div);
});
await mermaid.run();
</script>
</body>
</html>
